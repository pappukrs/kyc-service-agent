[project]
name = "kyc-servicing-agent"
version = "0.1.0"
description = "AI-assisted customer-servicing agent for retail-banking onboarding and KYC"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Data
    "motor>=3.6",
    "pymongo>=4.9",
    # Tools / agent
    "mcp>=2.0",
    "langchain>=1.0",
    "langgraph>=1.0",
    # NOTE: langchain-mcp-adapters is deliberately NOT a dependency. As of its
    # latest release (0.3.1) it imports mcp.server.fastmcp.tools, removed in MCP
    # SDK 2.0, so it cannot be imported against a current SDK. src/agent/mcp_tools.py
    # is a ~50-line replacement. Revisit if upstream ships MCP 2.x support.
    # Messaging
    "aiokafka>=0.12",
    # Observability
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
